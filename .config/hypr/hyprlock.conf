# Flexoki Dark lock screen: blurred wallpapers, clock and password field on the main monitor

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor = DP-6
    path = ~/Pictures/pc-hrz-2.jpg
    blur_passes = 3
    blur_size = 6
    brightness = 0.45
}

background {
    monitor = HDMI-A-2
    path = ~/Pictures/pc-vert-1.jpg
    blur_passes = 3
    blur_size = 6
    brightness = 0.45
}

label {
    monitor = DP-6
    text = cmd[update:1000] date +%H:%M
    color = rgb(CECDC3)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 220
    halign = center
    valign = center
}

label {
    monitor = DP-6
    text = cmd[update:60000] date "+%A, %d %B"
    color = rgb(878580)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 130
    halign = center
    valign = center
}

label {
    monitor = DP-6
    text = $USER
    color = rgb(CECDC3)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 4
    halign = center
    valign = center
}

input-field {
    monitor = DP-6
    size = 320, 46
    rounding = 0
    outline_thickness = 1
    outer_color = rgb(403E3C)
    inner_color = rgba(100F0FCC)
    font_color = rgb(CECDC3)
    font_family = JetBrainsMono Nerd Font
    check_color = rgb(DA702C)
    fail_color = rgb(D14D41)
    fail_text = wrong password
    placeholder_text = <span foreground="##878580">password</span>
    dots_size = 0.22
    dots_spacing = 0.4
    fade_on_empty = false
    position = 0, -60
    halign = center
    valign = center
}
