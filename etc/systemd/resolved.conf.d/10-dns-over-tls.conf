# Encrypted DNS for every app, so the ISP resolver can't see or rewrite lookups.
# Domains=~. makes these servers win over the router's DNS from DHCP.
# opportunistic: networks that block port 853 fall back to plain DNS instead of breaking.
[Resolve]
DNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com 9.9.9.9#dns.quad9.net
Domains=~.
DNSOverTLS=opportunistic
