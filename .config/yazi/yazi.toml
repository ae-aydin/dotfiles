[mgr]
ratio = [1, 4, 3]
sort_by = "natural"
sort_sensitive = false
sort_dir_first = true
show_hidden = true
show_symlink = true
title_format = "yazi"

[preview]
wrap = "yes"
tab_size = 2
image_filter = "nearest"
image_quality = 60

[opener]
play = [
    { run = 'mpv %s', orphan = true, for = "linux" },
]
edit = [
    { run = 'zed %s', orphan = true, for = "linux" },
    { run = 'zed --wait %s', block = true, desc = "zed (wait)", for = "linux" },
]
view = [
    { run = 'imv %s', orphan = true, for = "linux" },
]
open = [
    { run = 'xdg-open %s1', orphan = true, for = "linux" },
]

[open]
rules = [
    { mime = "text/*", use = "edit" },
    { mime = "video/*", use = "play" },
    { mime = "image/*", use = "view" },
    { url = "*.pdf", use = "open" },
    { mime = "*/*", use = "open" }
]
