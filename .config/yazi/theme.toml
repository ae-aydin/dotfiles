# Flexoki Dark for yazi; icons come from the preset
# bg #100F0F, bg+ #1C1B1A, border #282726
# fg #CECDC3, muted #878580, faint #575653, accent #DA702C

[mgr]
cwd = { fg = "#878580" }

hovered = { fg = "#100F0F", bg = "#CECDC3" }
preview_hovered = { fg = "#100F0F", bg = "#CECDC3" }

find_keyword = { fg = "#DA702C", bold = true }
find_position = { fg = "#DA702C", bg = "#282726", bold = true }

marker_copied = { fg = "#100F0F", bg = "#CECDC3" }
marker_cut = { fg = "#100F0F", bg = "#DA702C" }
marker_marked = { fg = "#DA702C", bg = "#282726" }
marker_selected = { fg = "#DA702C" }

count_copied = { fg = "#100F0F", bg = "#CECDC3" }
count_cut = { fg = "#100F0F", bg = "#DA702C" }
count_selected = { fg = "#100F0F", bg = "#878580" }

border_symbol = "│"
border_style = { fg = "#282726" }

[tabs]
active = { fg = "#100F0F", bg = "#CECDC3" }
inactive = { fg = "#878580", bg = "#1C1B1A" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#100F0F", bg = "#CECDC3", bold = true }
normal_alt = { fg = "#CECDC3", bg = "#282726" }
select_main = { fg = "#100F0F", bg = "#DA702C", bold = true }
select_alt = { fg = "#DA702C", bg = "#282726" }
unset_main = { fg = "#100F0F", bg = "#878580", bold = true }
unset_alt = { fg = "#878580", bg = "#282726" }

[status]
overall = { fg = "#CECDC3", bg = "#100F0F" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
progress_label = { fg = "#CECDC3", bold = true }
progress_normal = { fg = "#282726", bg = "#100F0F" }
progress_error = { fg = "#DA702C", bg = "#100F0F" }
perm_sep = { fg = "#282726" }
perm_type = { fg = "#DA702C" }
perm_read = { fg = "#CECDC3" }
perm_write = { fg = "#878580" }
perm_exec = { fg = "#575653" }

[filetype]
# Flexoki dark accents: blue #4385BE, cyan #3AA99F, green #879A39, yellow #D0A215, magenta #CE5D97, red #D14D41
rules = [
  { url = "*/", fg = "#4385BE", bold = true },
  { url = "*", is = "orphan", fg = "#D14D41" },
  { url = "*", is = "exec", fg = "#DA702C" },
  { mime = "image/*", fg = "#D0A215" },
  { mime = "{audio,video}/*", fg = "#CE5D97" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#D14D41" },
  { mime = "application/{pdf,doc,rtf,epub*}", fg = "#3AA99F" },
  { url = "*.{md,tex,bib}", fg = "#3AA99F" },
  { mime = "text/*", fg = "#879A39" },
  { mime = "application/{json,ndjson,javascript,toml,yaml}", fg = "#879A39" },
  { url = "*", fg = "#CECDC3" },
]
